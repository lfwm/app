<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PurplesStrat iOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --glass: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.18);
  --accent: #ff4dc4;
  --text: #f1f1f1;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(circle at top, #1a1a1a, #000);
  color: var(--text);
}

/* GLASS */
.glass {
  backdrop-filter: blur(20px);
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 20px;
}

/* HEADER */
header {
  margin: 20px;
  padding: 20px;
  text-align: center;
}
header h1 { margin: 0; }

/* TABS */
.tabs {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 20px;
}

.tab-button {
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--glass);
  color: var(--text);
  cursor: pointer;
}

.tab-button.active {
  background: linear-gradient(135deg, #ff4dc4, #a855f7);
  color: black;
}

/* CONTENT */
main {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* LABEL */
.section-label {
  padding: 14px;
  border-radius: 16px;
  background: linear-gradient(135deg, #ff4dc4, #a855f7);
  color: black;
}

/* GRID */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  backdrop-filter: blur(25px);
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px;
  text-align: center;
}

.card img {
  width: 80px;
  height: 80px;
  border-radius: 20px;
}

.card a {
  display: inline-block;
  margin-top: 10px;
  padding: 6px 16px;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff4dc4, #a855f7);
  color: black;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<header class="glass">
 <img src="https://purplesstrat.github.io/apple-1.png" alt=" Icon had gone missing :(" style="width:24px; height:24px; vertical-align:middle; margin-right:8px;">
    PurplesStrat
</header>

<nav class="tabs">
  <button class="tab-button active" data-tab="apps">Apps</button>
  <button class="tab-button" data-tab="news">News</button>
  <button class="tab-button" data-tab="certificates">Certificates</button>
  <button class="tab-button" data-tab="dns">DNS</button>
  <button class="tab-button" data-tab="executors">Executors</button>
  <button class="tab-button" data-tab="websites">Websites</button>
  <button class="tab-button" data-tab="ipas">IPAs</button>
  <button class="tab-button" data-tab="jailbreaks">Jailbreaks</button>
  <button class="tab-button" data-tab="apple">Apple Apps</button>
</nav>

<main>
  <section id="apps" class="tab-content active"><div class="card-grid" id="apps-section"></div></section>
  <section id="news" class="tab-content"><div class="card-grid" id="news-section"></div></section>
  <section id="certificates" class="tab-content"><div class="card-grid" id="certificates-section"></div></section>
  <section id="dns" class="tab-content"><div class="card-grid" id="dns-section"></div></section>
  <section id="executors" class="tab-content"><div class="card-grid" id="executors-section"></div></section>
  <section id="websites" class="tab-content"><div class="card-grid" id="websites-section"></div></section>
  <section id="ipas" class="tab-content"><div class="card-grid" id="ipas-section"></div></section>
  <section id="jailbreaks" class="tab-content"><div class="card-grid" id="jailbreaks-section"></div></section>
  <section id="apple" class="tab-content"><div class="card-grid" id="apple-section"></div></section>
</main>

<script type="module" src="https://raw.githubusercontent.com/purplesstrat/app/master/main.js"></script>
</body>
</html>
